<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyChavrusa</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fbfaf6;color:#17231d}.w{max-width:1050px;margin:auto;padding:20px}.nav,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:700 27px Georgia}.brand b{color:#1e5b42}.btn{border:1px solid #d9dfda;background:#fff;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:650}.primary{background:#1e5b42;color:#fff}.hero{text-align:center;padding:70px 0}.hero h1,.card h1{font:700 48px Georgia}.muted{color:#68736d}.choices,.grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice,.card,.item,.stat{background:#fff;border:1px solid #e2e6e2;border-radius:18px;padding:22px}.choice{text-align:left;cursor:pointer}.card{max-width:720px;margin:35px auto}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d6ddd7;border-radius:10px;background:white}.field textarea{min-height:90px}.msg{margin:12px 0;padding:11px;border-radius:9px;background:#f0f5f1}.err{background:#fff0ee;color:#943c32}.ok{background:#eaf5ee;color:#1e5b42}.dash{padding:25px 0}.stats{grid-template-columns:repeat(4,1fr);margin:20px 0}.stat b{display:block;font-size:26px}.list{display:grid;gap:10px}.badge{background:#edf2ee;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.privacy{font-size:13px;color:#68736d}@media(max-width:700px){.choices,.grid,.stats{grid-template-columns:1fr}.hero h1{font-size:40px}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main id="a"></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const s=createClient('https://fvujvlnvhlxdxjzyzfpv.supabase.co','sb_publishable_fy1cvZ_6KaROT1GRTXf06A_GyuxdCx0'),a=document.getElementById('a'),E=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),F=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),V=id=>document.getElementById(id).value.trim();function nav(log=false,back=false){return`<div class=w><div class=nav><div class=brand>My<b>Chavrusa</b></div><div>${back?'<button class=btn id=back>← Back</button>':''}<button class=btn id=acct>${log?'Sign out':'Sign in'}</button></div></div></div>`}function wire(log=false,backFn=null){if(backFn)back.onclick=backFn;acct.onclick=log?async()=>{await s.auth.signOut();home()}:signin}async function home(){let{data:{session}}=await s.auth.getSession();a.innerHTML=nav(!!session)+`<div class=w><section class=hero><div class=muted>THE RIGHT LEARNING CONNECTION</div><h1>A Chavrusa can make all the difference.</h1><p>Connecting families with the right person to learn with their son.</p>${session?'<p><button class="btn primary" id=dash>Open dashboard</button></p>':''}<div class=choices><div class=choice id=p><h2>I’m Looking for a Chavrusa</h2><p>Find someone to learn with your son — in person or online.</p></div><div class=choice id=c><h2>Become a Chavrusa</h2><p>Offer your time to learn with a Bochur.</p></div></div><p class=privacy>Privacy-first matching • Contact details are never public</p></section></div>`;wire(!!session);if(session)dash.onclick=route;p.onclick=parentForm;c.onclick=chavForm}function parentForm(){a.innerHTML=nav(false,true)+`<div class=card><h1>Find a Chavrusa</h1><p class=muted>Your son's full identity is not shown publicly.</p><div id=m></div><div class=grid><div class=field><label>Your first name</label><input id=fn></div><div class=field><label>Your last name</label><input id=ln></div><div class=field><label>Email</label><input id=email type=email></div><div class=field><label>Phone</label><input id=phone></div></div><div class=field><label>Create password</label><input id=pw type=password></div><h3>About your son</h3><div class=grid><div class=field><label>First name</label><input id=boy></div><div class=field><label>Age</label><input id=age type=number></div><div class=field><label>Current Yeshiva / Cheder</label><input id=yeshiva></div><div class=field><label>Location</label><input id=loc></div><div class=field><label>Preferred Language</label><select id=lang><option>English</option><option>Yiddish</option><option>Hebrew</option><option>No preference</option></select></div><div class=field><label>Learning format</label><select id=mode><option value=either>Either</option><option value=in_person>In person</option><option value=online>Online</option></select></div></div><div class=field><label>What would you like help with?</label><select id=purpose><option>Gemara - Girsa</option><option>Gemara - Iyun</option><option>Halacha</option><option>Mishnayos</option><option>Bar Mitzvah</option><option>Reading</option><option>Krias HaTorah</option><option>General Chavrusa</option><option>Other</option></select></div><div class=field><label>A few words (optional)</label><textarea id=notes></textarea></div><button class="btn primary" id=go>Create request</button><div class=msg><b>Privacy:</b> parents do not browse public full names or contact details. Contact is shared only after mutual interest.</div></div>`;wire(false,home);go.onclick=async()=>{if(!V('fn')||!V('email')||!V('pw')||!V('boy'))return m.innerHTML='<div class="msg err">Please complete the required fields.</div>';let x={boy:V('boy'),age:+V('age')||null,yeshiva:V('yeshiva'),loc:V('loc'),lang:V('lang'),mode:V('mode'),purpose:V('purpose'),notes:V('notes')},{data,error}=await s.auth.signUp({email:V('email'),password:V('pw'),options:{data:{role:'parent',first_name:V('fn'),last_name:V('ln'),phone:V('phone')}}});if(error)return m.innerHTML=`<div class="msg err">${E(error.message)}</div>`;localStorage.setItem('mc_pending',JSON.stringify({kind:'parent',...x}));if(data.session){await finishPending(data.user.id);route()}else m.innerHTML='<div class="msg ok">Account created. Confirm your email, then sign in to finish the request.</div>'}}function chavForm(){a.innerHTML=nav(false,true)+`<div class=card><h1>Become a Chavrusa</h1><p class=muted>You control how much parents can see.</p><div id=m></div><div class=grid><div class=field><label>First name</label><input id=fn></div><div class=field><label>Last name</label><input id=ln></div><div class=field><label>Email</label><input id=email type=email></div><div class=field><label>Phone</label><input id=phone></div><div class=field><label>Create password</label><input id=pw type=password></div><div class=field><label>Age</label><input id=age type=number></div><div class=field><label>Profile type</label><select id=type><option value=yungerman>Yungerman</option><option value=eltere_bochur>Eltere Bochur</option><option value=770_bochur>770 Bochur</option><option value=melamed_professional>Melamed / Professional</option><option value=other>Other</option></select></div><div class=field><label>Location</label><input id=loc></div><div class=field><label>Yeshiva / Kollel / Position</label><input id=position></div><div class=field><label>Learning format</label><select id=mode><option value=either>Either</option><option value=in_person>In person</option><option value=online>Online</option></select></div><div class=field><label>Approximate rate</label><input id=rate type=number placeholder="$ per hour"></div><div class=field><label>Languages</label><input id=langs placeholder="English, Yiddish, Hebrew"></div></div><div class=field><label>A few words about your learning / experience</label><textarea id=bio></textarea></div><div class=field><label>Profile privacy</label><select id=visibility><option value=anonymous>Recommended — anonymous match card</option><option value=first_name_visible>Show first name</option><option value=private>Private — admin suggestions only</option></select><p class=privacy>Private gives maximum privacy, but may reduce matches. The recommended option shows useful information without revealing your identity.</p></div><button class="btn primary" id=go>Create Chavrusa Profile</button><div class=msg><b>Reference Approved:</b> our team contacted a reference and marked the check complete. It is not a public guarantee. Verification details remain internal for now.</div></div>`;wire(false,home);go.onclick=async()=>{if(!V('fn')||!V('email')||!V('pw'))return m.innerHTML='<div class="msg err">Please complete the required fields.</div>';let x={type:V('type'),age:+V('age')||null,loc:V('loc'),position:V('position'),mode:V('mode'),rate:+V('rate')||null,langs:V('langs').split(',').map(x=>x.trim()).filter(Boolean),bio:V('bio'),visibility:V('visibility')},{data,error}=await s.auth.signUp({email:V('email'),password:V('pw'),options:{data:{role:'chavrusa',first_name:V('fn'),last_name:V('ln'),phone:V('phone')}}});if(error)return m.innerHTML=`<div class="msg err">${E(error.message)}</div>`;localStorage.setItem('mc_pending',JSON.stringify({kind:'chavrusa',...x}));if(data.session){await finishPending(data.user.id);route()}else m.innerHTML='<div class="msg ok">Account created. Confirm your email, then sign in to finish your profile.</div>'}}async function finishPending(uid){let x=JSON.parse(localStorage.getItem('mc_pending')||'null');if(!x)return;if(x.kind==='parent'){let{data:b,error}=await s.from('bochurim').insert({parent_id:uid,first_name:x.boy,age:x.age,current_yeshiva:x.yeshiva,location:x.loc,preferred_language:x.lang,notes:x.notes}).select('id').single();if(error)throw error;let q=await s.from('requests').insert({parent_id:uid,bochur_id:b.id,status:'new',purpose:x.purpose,learning_mode:x.mode,location:x.loc,preferred_language:x.lang,urgency:'exploring',family_notes:x.notes,budget_flexible:true});if(q.error)throw q.error}else{let q=await s.from('chavrusa_profiles').insert({id:uid,chavrusa_type:x.type,age:x.age,location:x.loc,current_yeshiva_kollel_position:x.position,languages:x.langs,experience_summary:x.bio,parent_facing_bio:x.bio,learning_mode:x.mode,rate_type:x.rate?'hourly':'flexible',rate_amount:x.rate,visibility:x.visibility,accepting_new_requests:true});if(q.error)throw q.error}localStorage.removeItem('mc_pending')}function signin(){a.innerHTML=nav(false,true)+`<div class=card><h1>Sign in</h1><div id=m></div><div class=field><label>Email</label><input id=email type=email></div><div class=field><label>Password</label><input id=pw type=password></div><button class="btn primary" id=go>Sign in</button> <button class=btn id=reset>Forgot password?</button></div>`;wire(false,home);go.onclick=async()=>{let{data,error}=await s.auth.signInWithPassword({email:V('email'),password:V('pw')});if(error)return m.innerHTML=`<div class="msg err">${E(error.message)}</div>`;try{await finishPending(data.user.id)}catch(x){return m.innerHTML=`<div class="msg err">Signed in, but setup needs attention: ${E(x.message)}</div>`}route()};reset.onclick=async()=>{if(!V('email'))return m.innerHTML='<div class="msg err">Enter your email first.</div>';let{error}=await s.auth.resetPasswordForEmail(V('email'),{redirectTo:location.origin});m.innerHTML=error?`<div class="msg err">${E(error.message)}</div>`:'<div class="msg ok">Reset email sent.</div>'}}async function route(){let{data:{user}}=await s.auth.getUser();if(!user)return signin();let{data:p}=await s.from('profiles').select('*').eq('id',user.id).single();if(!p)return home();let{data:ad}=await s.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();ad?admin(p):p.role==='parent'?parent(p):chav(p)}async function parent(p){let[{data:r},{data:b},{data:c}]=await Promise.all([s.from('requests').select('*').order('created_at',{ascending:false}),s.from('bochurim').select('*'),s.from('connections').select('*').order('updated_at',{ascending:false})]),bm=Object.fromEntries((b||[]).map(x=>[x.id,x]));a.innerHTML=nav(true)+`<div class="w dash"><div class=row><div><div class=muted>PARENT DASHBOARD</div><h1>Welcome, ${E(p.first_name)}</h1></div></div><div class=stats><div class=stat>Requests<b>${r?.length||0}</b></div><div class=stat>Connections<b>${c?.length||0}</b></div><div class=stat>Successful<b>${(c||[]).filter(x=>x.status==='successful').length}</b></div><div class=stat>Bochurim<b>${b?.length||0}</b></div></div><h2>Your Requests</h2><div class=list>${(r||[]).map(x=>{let q=bm[x.bochur_id]||{};return`<div class=item><div class=row><div><b>${E(q.first_name||'Bochur')} • ${E(q.age||'')}</b><div class=muted>${E(x.purpose||'')} • ${E(F(x.learning_mode))}</div></div><span class=badge>${E(F(x.status))}</span></div></div>`}).join('')||'<div class=item>No requests yet.</div>'}</div></div>`;wire(true)}async function chav(p){let[{data:cp},{data:i}]=await Promise.all([s.from('chavrusa_profiles').select('*').eq('id',p.id).single(),s.rpc('chavrusa_incoming_requests')]);a.innerHTML=nav(true)+`<div class="w dash"><div class=muted>CHAVRUSA DASHBOARD</div><h1>Welcome, ${E(p.first_name)}</h1><div class=stats><div class=stat>Incoming<b>${i?.length||0}</b></div><div class=stat>Identity<b style="font-size:16px">${E(F(cp?.identity_status))}</b></div><div class=stat>Reference<b style="font-size:16px">${E(F(cp?.reference_status))}</b></div><div class=stat>Visibility<b style="font-size:16px">${E(F(cp?.visibility))}</b></div></div><h2>Incoming Requests</h2><div class=list>${(i||[]).map(x=>`<div class=item><div class=row><div><b>${E(x.bochur_display)} • Age ${E(x.age)}</b><div class=muted>${E(x.location||'')} • ${E(F(x.learning_mode))}</div></div>${x.status==='parent_requested'?`<div><button class="btn primary" data-y=${x.connection_id}>Interested</button> <button class=btn data-n=${x.connection_id}>Pass</button></div>`:`<span class=badge>${E(F(x.status))}</span>`}</div></div>`).join('')||'<div class=item>No incoming requests.</div>'}</div></div>`;wire(true);document.querySelectorAll('[data-y]').forEach(x=>x.onclick=()=>respond(x.dataset.y,true));document.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>respond(x.dataset.n,false))}async function respond(id,yes){let{error}=await s.rpc('respond_to_connection',{p_connection_id:id,p_interested:yes});error?alert(error.message):route()}async function admin(p){let[{count:t},{count:r},{data:pd}]=await Promise.all([s.from('chavrusa_profiles').select('*',{count:'exact',head:true}),s.from('requests').select('*',{count:'exact',head:true}),s.from('chavrusa_profiles').select('chavrusa_type,location,identity_status,reference_status').or('identity_status.eq.pending,reference_status.eq.not_contacted').limit(10)]);a.innerHTML=nav(true)+`<div class="w dash"><div class=muted>ADMIN DASHBOARD</div><h1>MyChavrusa Control Center</h1><div class=stats><div class=stat>Chavrusas<b>${t||0}</b></div><div class=stat>Requests<b>${r||0}</b></div><div class=stat>Pending<b>${pd?.length||0}</b></div><div class=stat>System<b style="font-size:16px">Active</b></div></div><h2>Pending Verification</h2><div class=list>${(pd||[]).map(x=>`<div class=item><b>${E(F(x.chavrusa_type))} • ${E(x.location||'')}</b><div class=muted>Identity: ${E(F(x.identity_status))} • Reference: ${E(F(x.reference_status))}</div></div>`).join('')||'<div class=item>Nothing waiting.</div>'}</div></div>`;wire(true)}home();</script></body></html>
