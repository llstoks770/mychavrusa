'),active=(rs||[]).filter(x=>x.status!=='closed');a.innerHTML=nav(true)+`<div class="w dash"><div class=row><div><div class=muted>ADMIN DASHBOARD</div><h1>MyChavrusa Control Center</h1></div><span class=badge>Internal only</span></div><div class=stats><div class=stat>Chavrusas<b>${cps?.length||0}</b></div><div class=stat>Active Requests<b>${active.length}</b></div><div class=stat>Connections<b>${cs?.length||0}</b></div><div class=stat>Needs Review<b>${inactive.length}</b></div></div><h2>Chavrusa Review Queue</h2><p class=muted>Identity/reference information and approval controls are internal and are not shown on parent match cards.</p><div class=list>${inactive.slice(0,20).map(x=>{let q=pm[x.id]||{};return`<div class=item><div class=row><div><b>${E(q.first_name||'')} ${E(q.last_name||'')}</b><div class=muted>${E(F(x.chavrusa_type))} • ${E(x.location||'')} • ${E(F(x.visibility))}</div><div class=privacy>Identity: ${E(F(x.identity_status))} • Reference: ${E(F(x.reference_status))}</div></div><div>${x.identity_status!=='verified'?`<button class=btn data-idv="${x.id}" data-ref="${x.reference_status}">ID Verified</button>`:''} ${x.reference_status!=='checked'?`<button class=btn data-refv="${x.id}" data-identity="${x.identity_status}">Reference Checked</button>`:''} ${x.identity_status==='verified'&&x.reference_status==='checked'?`<button class="btn primary" data-activate="${x.id}">Approve & Activate</button>`:'<span class=badge>Complete checks first</span>'}</div></div></div>`}).join('')||'<div class=item>No profiles waiting for approval.</div>'}</div><h2>Pending Verification</h2><div class=list>${pending.slice(0,12).map(x=>{let q=pm[x.id]||{};return`<div class=item><div class=row><div><b>${E(q.first_name||'')} ${E(q.last_name||'')}</b><div class=muted>${E(F(x.chavrusa_type))} • ${E(x.location||'')}</div></div><div><span class=badge>Identity: ${E(F(x.identity_status))}</span> <span class=badge>Reference: ${E(F(x.reference_status))}</span></div></div></div>`}).join('')||'<div class=item>Nothing waiting.</div>'}</div><h2>Private Chavrusa Profiles</h2><p class=muted>These profiles are never shown in the normal parent match list. They are for admin-assisted suggestions.</p><div class=list>${priv.slice(0,10).map(x=>{let q=pm[x.id]||{};return`<div class=item><b>${E(q.first_name||'')} ${E(q.last_name||'')}</b><div class=muted>${E(F(x.chavrusa_type))} • ${E(x.location||'')} • ${E((x.languages||[]).join(', '))}</div></div>`}).join('')||'<div class=item>No private profiles right now.</div>'}</div><h2>Recent Requests</h2><div class=list>${(rs||[]).slice(0,12).map(x=>{let b=bm[x.bochur_id]||{},q=pm[x.parent_id]||{};return`<div class=item><div class=row><div><b>${E(b.first_name||'Bochur')}${b.age?' • Age '+E(b.age):''}</b><div class=muted>${E(x.purpose||'')} • ${E(F(x.learning_mode))} • ${E(x.location||'')}</div><div class=privacy>Parent: ${E(q.first_name||'')} ${E(q.last_name||'')}</div></div><span class=badge>${E(F(x.status))}</span></div></div>`}).join('')||'<div class=item>No requests yet.</div>'}</div></div>`;wire(true);document.querySelectorAll('[data-idv]').forEach(b=>b.onclick=async()=>{b.disabled=true;let{error}=await s.rpc('admin_set_chavrusa_verification',{p_chavrusa_id:b.dataset.idv,p_identity_status:'verified',p_reference_status:b.dataset.ref,p_admin_notes:null});if(error)return alert(error.message);admin(p)});document.querySelectorAll('[data-refv]').forEach(b=>b.onclick=async()=>{b.disabled=true;let{error}=await s.rpc('admin_set_chavrusa_verification',{p_chavrusa_id:b.dataset.refv,p_identity_status:b.dataset.identity,p_reference_status:'checked',p_admin_notes:null});if(error)return alert(error.message);admin(p)});document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=async()=>{b.disabled=true;let{error}=await s.rpc('admin_set_chavrusa_active',{p_chavrusa_id:b.dataset.activate,p_active:true});if(error)return alert(error.message);admin(p)})}boot();</script></body></html>
